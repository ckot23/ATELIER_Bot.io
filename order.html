<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ATELIER — Оставить заявку</title>
<style>
:root{--text:#f7f1ea;--muted:rgba(247,241,234,.66);--accent:#e8893a;--accent-2:#ffb067;--ink:#1a120c;--line:rgba(255,196,140,.18);--surface:rgba(20,16,12,.72);--max:600px}
*{box-sizing:border-box;margin:0;padding:0}
body{color:var(--text);font:16px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#070706;min-height:100vh;display:flex;flex-direction:column}
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(80% 60% at 20% 30%,rgba(232,137,58,.25),transparent 60%),linear-gradient(180deg,#070706,#140f0c)}
header{backdrop-filter:blur(16px);background:rgba(7,7,6,.8);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:13px 24px;max-width:var(--max);margin:0 auto}
.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(150deg,#ffb067,#e8893a);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand-text strong{display:block;font-size:15px}
.brand-text span{font-size:11px;color:var(--muted)}
.back{margin-left:auto;font-size:13px;color:var(--muted);padding:6px 12px;border-radius:8px;border:1px solid var(--line);text-decoration:none;transition:color .15s}
.back:hover{color:var(--text)}
.wrap{flex:1;width:min(100% - 32px,var(--max));margin:0 auto;padding:40px 0 60px}
h1{font-size:28px;margin-bottom:8px}
.lead{color:var(--muted);font-size:15px;margin-bottom:32px}
.form-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;backdrop-filter:blur(14px)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;margin-top:18px}
label:first-child{margin-top:0}
input,textarea,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);font:15px/1.5 inherit;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:rgba(255,176,103,.5)}
select option{background:#1a120c}
textarea{resize:vertical;min-height:90px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:12px;font-weight:700;font-size:16px;border:0;cursor:pointer;margin-top:22px;background:linear-gradient(175deg,#ffb067,#e8893a);color:var(--ink);transition:transform .18s,box-shadow .18s;text-decoration:none}
.btn:hover{transform:scale(1.03);box-shadow:0 8px 28px rgba(196,92,34,.4)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="bg"></div>
<header>
  <div class="top">
    <div class="mark">A</div>
    <div class="brand-text"><strong>ATELIER</strong><span>Боты Telegram</span></div>
    <a class="back" href="index.html">← На сайт</a>
  </div>
</header>
<div class="wrap">
  <h1>Оставить заявку</h1>
  <p class="lead">Оценю задачу бесплатно и отвечу в течение рабочего дня.</p>
  <div class="form-card">
    <label>Как вас зовут?</label>
    <input type="text" placeholder="Имя" />
    <label>Telegram или телефон</label>
    <input type="text" placeholder="@username или +7..."/>
    <label>Какой бот вам нужен?</label>
    <select>
      <option value="">Выберите тип</option>
      <option>Бот записи — от 15 000 руб.</option>
      <option>Бот поддержки — от 20 000 руб.</option>
      <option>Бот для канала — от 25 000 руб.</option>
      <option>Бот-магазин — от 30 000 руб.</option>
      <option>Другое / не знаю</option>
    </select>
    <label>Опишите задачу</label>
    <textarea placeholder="Что должен делать бот? Есть ли интеграции? Любая дополнительная инфо..."></textarea>
    <a class="btn" href="https://t.me/" target="_blank">Отправить в Telegram</a>
    <p class="note">Нажмите кнопку — откроется Telegram с предзаполненным сообщением. Отвечу в течение рабочего дня.</p>
  </div>
</div>
</body>
</html>
